{% extends "base.html" %}
{% block title %}Login | SRIT HIVE - Hub for Innovation & Entrepreneurship{% endblock %}

{% block content %}
<style>
.auth-wrapper {
  max-width: 480px;
  margin: 40px auto 60px;
}

.auth-card {
  background: var(--hive-surface);
  border: 1px solid var(--hive-border);
  border-radius: var(--radius-xl);
  padding: 40px 36px;
  box-shadow: var(--shadow-lg);
}

.auth-header {
  text-align: center;
  margin-bottom: 28px;
}

.auth-logo {
  height: 48px;
  width: auto;
  margin: 0 auto 12px;
}

.auth-title {
  font-size: 1.65rem;
  font-weight: 800;
  color: var(--hive-text-title);
  margin-bottom: 4px;
}

.auth-sub {
  font-size: 0.85rem;
  color: var(--hive-text-muted);
}

.auth-field {
  margin-bottom: 18px;
}

.auth-field label {
  display: block;
  font-size: 0.8rem;
  font-weight: 700;
  color: var(--hive-text-title);
  margin-bottom: 6px;
}

.auth-pw-wrap {
  position: relative;
}

.auth-pw-toggle {
  position: absolute;
  right: 12px;
  top: 50%;
  transform: translateY(-50%);
  background: none;
  border: none;
  color: var(--hive-text-muted);
  font-size: 0.78rem;
  font-weight: 600;
  cursor: pointer;
  padding: 4px;
}

.auth-btn-submit {
  width: 100%;
  padding: 12px 20px;
  background: var(--hive-dark-navy);
  color: #ffffff;
  border: none;
  border-radius: var(--radius-sm);
  font-size: 0.92rem;
  font-weight: 700;
  cursor: pointer;
  margin-top: 10px;
  transition: all .2s;
  box-shadow: 0 4px 12px rgba(5,29,45,.2);
}

.auth-btn-submit:hover {
  background: var(--hive-navy-700);
  transform: translateY(-1px);
}

.auth-footer-links {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 24px;
  padding-top: 18px;
  border-top: 1px solid var(--hive-border-subtle);
  font-size: 0.82rem;
  flex-wrap: wrap;
  gap: 8px;
}

.auth-footer-links a {
  color: var(--hive-teal);
  font-weight: 600;
}

.auth-footer-links a:hover {
  text-decoration: underline;
}

.auth-secure-badge {
  text-align: center;
  margin-top: 24px;
  font-size: 0.72rem;
  color: var(--hive-text-muted);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}
</style>

<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-header">
      <img src="{{ url_for('static', filename='images/hive_logo.png') }}" alt="SRIT HIVE" class="auth-logo">
      <h1 class="auth-title">Sign in to HIVE</h1>
      <p class="auth-sub">Access your student or faculty workspace.</p>
    </div>

    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      
      <div class="auth-field">
        <label for="email">Email ID</label>
        <input type="email" id="email" name="email" placeholder="name@srit.ac.in" required autocomplete="email">
      </div>

      <div class="auth-field">
        <label for="password">Password</label>
        <div class="auth-pw-wrap">
          <input type="password" id="password" name="password" placeholder="Enter your password" required autocomplete="current-password" style="padding-right: 50px;">
          <button type="button" class="auth-pw-toggle" onclick="togglePw()" id="pw-toggle-btn">Show</button>
        </div>
      </div>

      <button type="submit" class="auth-btn-submit">Sign In &rarr;</button>

      <div class="auth-footer-links">
        <a href="{{ url_for('forgot_password') }}">Forgot password?</a>
        <a href="{{ url_for('register') }}">Create account</a>
      </div>

      <div class="auth-secure-badge">
        <span>🔒</span> Secured with Firebase Authentication
      </div>
    </form>
  </div>
</div>

<script>
function togglePw() {
  var inp = document.getElementById('password');
  var btn = document.getElementById('pw-toggle-btn');
  if (inp.type === 'password') {
    inp.type = 'text';
    btn.textContent = 'Hide';
  } else {
    inp.type = 'password';
    btn.textContent = 'Show';
  }
}
</script>
{% endblock %}
