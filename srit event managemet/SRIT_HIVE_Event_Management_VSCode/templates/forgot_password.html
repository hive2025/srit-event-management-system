{% extends "base.html" %}
{% block title %}Forgot Password | SRIT HIVE{% endblock %}

{% block content %}
<div class="form-card" style="max-width:480px; margin: 40px auto 60px;">
  <div style="text-align:center; margin-bottom: 24px;">
    <div style="font-size: 2.2rem; margin-bottom: 8px;">🔑</div>
    <h2 style="color:var(--hive-text-title); margin-bottom: 4px;">Forgot Password</h2>
    <p class="small">Enter your registered email address to receive password reset instructions.</p>
  </div>

  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    
    <div class="field" style="margin-bottom: 24px;">
      <label>Email Address <span style="color:var(--hive-red)">*</span></label>
      <input type="email" name="email" placeholder="name@srit.ac.in" required autocomplete="email">
    </div>

    <button class="btn btn-dark" type="submit" style="width:100%; padding: 11px 18px; margin-bottom: 16px;">Send Reset Link &rarr;</button>

    <div style="text-align:center; font-size: 0.82rem;">
      <a href="{{ url_for('login') }}" style="color:var(--hive-teal); font-weight: 600;">&larr; Back to Login</a>
    </div>
  </form>
</div>
{% endblock %}
