{% extends "base.html" %}
{% block title %}Change Password | SRIT HIVE{% endblock %}

{% block content %}
<div class="form-card" style="max-width:520px; margin: 40px auto 60px;">
  <div style="text-align:center; margin-bottom: 24px;">
    <div style="font-size: 2.2rem; margin-bottom: 8px;">🔐</div>
    <h2 style="color:var(--hive-text-title); margin-bottom: 4px;">Change Password</h2>
    <p class="small">Enter your current password and choose a new secure password.</p>
  </div>

  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    
    <div class="field" style="margin-bottom: 16px;">
      <label>Current Password <span style="color:var(--hive-red)">*</span></label>
      <input type="password" name="current_password" placeholder="Enter current password" required>
    </div>

    <div class="field" style="margin-bottom: 16px;">
      <label>New Password <span style="color:var(--hive-red)">*</span></label>
      <input type="password" name="new_password" placeholder="Minimum 6 characters" required minlength="6">
    </div>

    <div class="field" style="margin-bottom: 24px;">
      <label>Confirm New Password <span style="color:var(--hive-red)">*</span></label>
      <input type="password" name="confirm_password" placeholder="Re-enter new password" required minlength="6">
    </div>

    <div style="display:flex; gap: 10px; align-items:center;">
      <button class="btn btn-dark" type="submit" style="flex:1;">Update Password</button>
      <a class="btn btn-secondary" href="{{ url_for('profile') }}">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
